# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    telegram_bot_token: '%env(TELEGRAM_TOKEN)%'
    app.debt_block_threshold: '%env(int:DEBT_BLOCK_THRESHOLD)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $projectDir: '%kernel.project_dir%'
            $publicDir: '%kernel.project_dir%/public'
            $pavilion1PhotoFileId: '%env(string:PAVILION1_PHOTO_FILE_ID)%'
            $pavilion2PhotoFileId: '%env(string:PAVILION2_PHOTO_FILE_ID)%'
            $residentChatId: '%env(string:RESIDENT_CHAT_ID)%'
            $residentChatInviteLink: '%env(string:RESIDENT_CHAT_INVITE_LINK)%'
            # Forum topics of that group. Empty means «post into General», which is what
            # the bot did before the group had topics at all.
            $topicComplaints: '%env(string:RESIDENT_CHAT_TOPIC_COMPLAINTS)%'
            $topicDebt: '%env(string:RESIDENT_CHAT_TOPIC_DEBT)%'
            $topicRentals: '%env(string:RESIDENT_CHAT_TOPIC_RENTALS)%'
            $topicServices: '%env(string:RESIDENT_CHAT_TOPIC_SERVICES)%'
            $topicVotes: '%env(string:RESIDENT_CHAT_TOPIC_VOTES)%'
            # Telegram ids allowed to move a complaint's status — the head of the ОСББ.
            # One or two people who change about never, so this is config, not a column.
            $managerIds: '%env(string:COMPLAINT_MANAGER_TELEGRAM_IDS)%'
            # Telegram ids of the gate. Same shape and the same rule: empty means nobody,
            # never everybody — this board names which flat is in which pavilion.
            $guardIds: '%env(string:GUARD_TELEGRAM_IDS)%'
            # Signs the resident's QR code. Nothing is stored: the signature is the only
            # thing that stops a code being drawn for a flat read off the debtors' board.
            $appSecret: '%env(string:APP_SECRET)%'
            # Where the nightly database dump is sent. A backup that lives on the server
            # it protects is not a backup — if the machine goes, so does it.
            $backupChatId: '%env(string:BACKUP_TELEGRAM_CHAT_ID)%'
            $backupEmail: '%env(string:BACKUP_EMAIL)%'
            $mailerDsn: '%env(string:MAILER_DSN)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\DebtPolicy:
        arguments:
            $threshold: '%app.debt_block_threshold%'

    # StartCommand resolves this at render time via $bot->getContainer(), which
    # delegates to '@service_container' — and that only exposes PUBLIC services.
    # It must be the same shared instance RequestSubscriber called initUser() on,
    # otherwise the resolved instance has no current user.
    App\Service\TelegramUserService:
        public: true

    # Same reason as above: the main menu asks it, at render time, whether the residents'
    # chat exists yet — a button leading to a chat that has not been created is worse
    # than no button.
    App\Service\ResidentChatService:
        public: true

    # Same reason again: StartCommand renders the debtors' board on every menu draw and
    # can only reach it through the bot container, which exposes public services only.
    App\Service\DebtBoardService:
        public: true

    # Same reason: the main menu shows the head of the ОСББ and the open-complaint count,
    # and StartCommand can only reach services the bot container exposes.
    App\Service\ComplaintService:
        public: true

    # The menu button carries the open-complaint count, and StartCommand's static helpers
    # can only reach services the bot container exposes.
    App\Repository\ComplaintRepository:
        public: true

    # And once more for «🛠 Послуги (7)»: the menu asks it how many offers are live at
    # render time. Private, it would be inlined away and the button would silently lose
    # its count — or, since the lookup is wrapped in a catch, quietly render the label
    # without one and look like nobody in the house does anything.
    App\Repository\ServiceOfferRepository:
        public: true

    # Same reason once more, and this one shipped broken for an evening: the menu asks it
    # whether the reader is a guard and whether their booking is running right now. Both
    # lookups are wrapped in `catch (\Throwable) { return false; }` — the right shape for a
    # decoration, and the reason a private service failed *silently*: the buttons simply
    # never appeared, with nothing in any log.
    App\Service\GuardService:
        public: true

    # Same reason: the menu header names every object the household owns, and the owner
    # group behind that list is only reachable through a service the bot container exposes.
    App\Service\PropertyRegistry:
        public: true

    # Nutgram handlers
    App\Telegram\:
        public: true
        shared: false
        resource: '../src/Telegram'
        exclude:
            - '../src/Telegram/Location/Model'
