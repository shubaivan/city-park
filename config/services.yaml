# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    telegram_bot_token: '%env(TELEGRAM_TOKEN)%'
    app.debt_block_threshold: '%env(int:DEBT_BLOCK_THRESHOLD)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $projectDir: '%kernel.project_dir%'
            $publicDir: '%kernel.project_dir%/public'
            $pavilion1PhotoFileId: '%env(string:PAVILION1_PHOTO_FILE_ID)%'
            $pavilion2PhotoFileId: '%env(string:PAVILION2_PHOTO_FILE_ID)%'
            $residentChatId: '%env(string:RESIDENT_CHAT_ID)%'
            $residentChatInviteLink: '%env(string:RESIDENT_CHAT_INVITE_LINK)%'
            # Telegram ids allowed to move a complaint's status — the head of the ОСББ.
            # One or two people who change about never, so this is config, not a column.
            $managerIds: '%env(string:COMPLAINT_MANAGER_TELEGRAM_IDS)%'
            # Where the nightly database dump is sent. A backup that lives on the server
            # it protects is not a backup — if the machine goes, so does it.
            $backupChatId: '%env(string:BACKUP_TELEGRAM_CHAT_ID)%'
            $backupEmail: '%env(string:BACKUP_EMAIL)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        exclude:
            - '../src/DependencyInjection/'
            - '../src/Entity/'
            - '../src/Kernel.php'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    App\Service\DebtPolicy:
        arguments:
            $threshold: '%app.debt_block_threshold%'

    # StartCommand resolves this at render time via $bot->getContainer(), which
    # delegates to '@service_container' — and that only exposes PUBLIC services.
    # It must be the same shared instance RequestSubscriber called initUser() on,
    # otherwise the resolved instance has no current user.
    App\Service\TelegramUserService:
        public: true

    # Same reason as above: the main menu asks it, at render time, whether the residents'
    # chat exists yet — a button leading to a chat that has not been created is worse
    # than no button.
    App\Service\ResidentChatService:
        public: true

    # Same reason again: StartCommand renders the debtors' board on every menu draw and
    # can only reach it through the bot container, which exposes public services only.
    App\Service\DebtBoardService:
        public: true

    # Same reason: the main menu shows the head of the ОСББ and the open-complaint count,
    # and StartCommand can only reach services the bot container exposes.
    App\Service\ComplaintService:
        public: true

    # The menu button carries the open-complaint count, and StartCommand's static helpers
    # can only reach services the bot container exposes.
    App\Repository\ComplaintRepository:
        public: true

    # Nutgram handlers
    App\Telegram\:
        public: true
        shared: false
        resource: '../src/Telegram'
        exclude:
            - '../src/Telegram/Location/Model'
