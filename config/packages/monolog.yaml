monolog:
    channels:
        - deprecation # Deprecations are logged in the dedicated "deprecation" channel when it exists
        - photo # Pavilion photo-upload + reminder audit trail (see var/log/photo-upload.log)
        - chat  # Residents' group gate: who knocked and why they were let in or not (see var/log/resident-chat.log)

when@dev:
    monolog:
        handlers:
            main:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug
                channels: ["!event", "!photo", "!chat"]
            photo_upload:
                type: stream
                path: "%kernel.logs_dir%/photo-upload.log"
                level: info
                channels: ["photo"]
            resident_chat:
                type: stream
                path: "%kernel.logs_dir%/resident-chat.log"
                level: info
                channels: ["chat"]
            # uncomment to get logging in your browser
            # you may have to allow bigger header sizes in your Web server configuration
            #firephp:
            #    type: firephp
            #    level: info
            #chromephp:
            #    type: chromephp
            #    level: info
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine", "!console"]

when@test:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                channels: ["!event"]
            nested:
                type: stream
                path: "%kernel.logs_dir%/%kernel.environment%.log"
                level: debug

when@prod:
    monolog:
        handlers:
            main:
                type: fingers_crossed
                action_level: error
                handler: nested
                excluded_http_codes: [404, 405]
                buffer_size: 50 # How many messages should be saved? Prevent memory leaks
                channels: ["!photo", "!chat"] # these audit trails must NOT be buffered by fingers_crossed (would be dropped unless an error follows)
            nested:
                type: stream
                path: php://stderr
                level: debug
                formatter: monolog.formatter.json
            # php-fpm runs without catch_workers_output, so everything the handlers above
            # write to stderr is discarded: a hard 500 on /hook (Telegram then retries the
            # same update for an hour) left no trace anywhere for two weeks — see the
            # 02.08/16.08.2026 swallowed-photo incident. Keep errors in a real file.
            # Wrapped in fingers_crossed purely for its excluded_http_codes: Symfony logs
            # every unmatched route as ERROR, and this host is scanned around the clock
            # (/wp-includes/…, *.PhP shells, /autodiscover/…) — ~1000 lines a day that
            # buried the real errors. nginx's citypark_access.log already records those
            # requests, so nothing is lost by dropping them here. buffer_size 1 means the
            # buffer holds only the triggering record: a real error must never arrive with
            # a replay of the 404s that preceded it.
            errors_file:
                type: fingers_crossed
                action_level: error
                handler: errors_file_nested
                excluded_http_codes: [404, 405]
                buffer_size: 1
                channels: ["!photo", "!chat", "!event"]
            errors_file_nested:
                type: stream
                path: "%kernel.logs_dir%/prod_errors.log"
                level: error
                formatter: monolog.formatter.json
            # Persistent, greppable audit trail for photo uploads + reminder/block delivery.
            # Written unconditionally at info level to a real file (not stderr/fingers_crossed),
            # so we can always answer "did the photo arrive, and what happened to it?".
            photo_upload:
                type: stream
                path: "%kernel.logs_dir%/photo-upload.log"
                level: info
                channels: ["photo"]
            # Same reasoning as photo_upload: the gate answers "why was I not let in?" for
            # ~150 people, and on prod an info-level line on the default channel goes to
            # fingers_crossed and then to stderr, which php-fpm throws away.
            resident_chat:
                type: stream
                path: "%kernel.logs_dir%/resident-chat.log"
                level: info
                channels: ["chat"]
            console:
                type: console
                process_psr_3_messages: false
                channels: ["!event", "!doctrine"]
            deprecation:
                type: stream
                channels: [deprecation]
                path: php://stderr
                formatter: monolog.formatter.json
