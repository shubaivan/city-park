security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'
    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users_in_memory:
            memory:
                users:
                    main_admin: { password: "%env(MAIN_ADMIN_PASSWORD)%", roles: [ 'ROLE_ADMIN' ] }
                    alina:      { password: "%env(ALINA_ADMIN_PASSWORD)%", roles: [ 'ROLE_ADMIN' ] }
                    luda_boss:  { password: "%env(LUDA_ADMIN_PASSWORD)%", roles: [ 'ROLE_ADMIN' ] }
                    # Complaints only: he answers for repairs, not for who lives where.
                    # ROLE_ADMIN would hand him the resident register and the debt upload,
                    # which is the accountant's work and nobody else's.
                    serhii:     { password: "%env(SERHII_ADMIN_PASSWORD)%", roles: [ 'ROLE_COMPLAINTS' ] }
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        main:
            lazy: true
            provider: users_in_memory
            form_login:
                login_path: app_login
                check_path: app_login
                enable_csrf: true
            logout:
                path: app_logout

    access_control:
        # Order matters — the first match wins. The complaints register and the dashboard
        # that leads to it are open to both roles; everything else under /admin is the
        # full administrator's.
        - { path: ^/admin/complaints, roles: [ROLE_ADMIN, ROLE_COMPLAINTS] }
        - { path: ^/admin$, roles: [ROLE_ADMIN, ROLE_COMPLAINTS] }
        # The sign-in log is read by everyone who can sign in, deliberately: four
        # colleagues seeing each other's visits is what makes an entry nobody recognises
        # get mentioned the same day. Nothing here is anybody's to change, so GET only.
        - { path: ^/admin/logins$, methods: [GET], roles: [ROLE_ADMIN, ROLE_COMPLAINTS] }
        # Same call: it says whether the chat posts are working, which is as useful to
        # the person answering the complaints as to the accountant. Nothing to change.
        - { path: ^/admin/links$, methods: [GET], roles: [ROLE_ADMIN, ROLE_COMPLAINTS] }
        # Who scanned whose QR code. Read by everyone who can sign in — the question it
        # answers («хто їх пустив і коли вони заходили») is asked by whoever is dealing
        # with what happened, and that is as often the repairs side as the accountant.
        # GET only: a security log that can be edited is not a log.
        - { path: ^/admin/scans$, methods: [GET], roles: [ROLE_ADMIN, ROLE_COMPLAINTS] }
        # A resident's cached Telegram photo. Both roles already read the resident register,
        # and a face is the least of what is on that page — but it is still served from
        # var/, behind this login, rather than published under public/.
        - { path: '^/admin/avatar/\d+(/full)?$', methods: [GET], roles: [ROLE_ADMIN, ROLE_COMPLAINTS] }
        # Looking is allowed, acting is not: he answers for repairs and needs to know which
        # flat reported what, but linking a resident, moving them or editing an object is
        # the accountant's work. GET only — plus the table's own POST, or the list he opens
        # comes up empty and looks broken rather than restricted.
        - { path: ^/admin/(users|objects), methods: [GET], roles: [ROLE_ADMIN, ROLE_COMPLAINTS] }
        - { path: ^/admin/users/data-table$, methods: [POST], roles: [ROLE_ADMIN, ROLE_COMPLAINTS] }
        - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
